version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      next-react: { patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"] }
      capacitor: { patterns: ["@capacitor/*"] }
      dev-tooling: { dependency-type: development, update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(docker)" }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(android)" }
