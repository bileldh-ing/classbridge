name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["video/**", ".github/workflows/render-video.yml"]
  pull_request:
    paths-ignore: ["video/**", ".github/workflows/render-video.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Test-only secret (32+ chars). Never used outside CI.
  AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
        env:
          SKIP_DB: "1"

  integration:
    name: Integration tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: classbridge
          POSTGRES_PASSWORD: classbridge
          POSTGRES_DB: classbridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U classbridge" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://classbridge:classbridge@localhost:5432/classbridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (real Postgres, committed migrations)
        run: pnpm test:integration

  e2e:
    name: Build + Playwright e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: classbridge
          POSTGRES_PASSWORD: classbridge
          POSTGRES_DB: classbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U classbridge" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://classbridge:classbridge@localhost:5432/classbridge
      APP_URL: http://localhost:3000
      E2E_NO_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: next build (standalone)
        run: pnpm build
      - name: Migrate + seed demo data
        run: pnpm db:migrate && pnpm db:seed
      - name: Start app (standalone server)
        run: |
          bash scripts/prepare-standalone.sh
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health/ready && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health/ready
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright e2e
        run: pnpm test:e2e
      - name: Server log
        if: always()
        run: tail -n 200 server.log || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: classbridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
