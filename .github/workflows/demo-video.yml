name: Demo video

on:
  workflow_dispatch:
    inputs:
      pause_ms:
        description: "Hold time per caption/step in ms (longer = calmer pacing for the edited video)"
        default: "3000"

permissions:
  contents: read

jobs:
  demo:
    name: Record demo tour (one video per scene)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: classbridge
          POSTGRES_PASSWORD: classbridge
          POSTGRES_DB: classbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U classbridge" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://classbridge:classbridge@localhost:5432/classbridge
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
      E2E_NO_SERVER: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      DEMO_PAUSE_MS: ${{ inputs.pause_ms || '1600' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate && pnpm db:seed
      - name: Start seeded app
        run: |
          bash scripts/prepare-standalone.sh
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health/ready && break; sleep 2; done
      - run: pnpm exec playwright install --with-deps chromium
      - name: Record scenes
        run: pnpm test:demo
      - name: List videos
        if: always()
        run: ls -la demo-scenes || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-scenes
          path: demo-scenes/*.webm
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-report
          path: playwright-demo-report
