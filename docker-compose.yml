# Local production-like stack: app (standalone image) + PostgreSQL 17.
#   docker compose up --build        → http://localhost:3000
#   docker compose run --rm migrate  → apply migrations (runs automatically before app start)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: classbridge
      POSTGRES_PASSWORD: classbridge
      POSTGRES_DB: classbridge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classbridge"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgres://classbridge:classbridge@db:5432/classbridge
    depends_on:
      db: { condition: service_healthy }
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://classbridge:classbridge@db:5432/classbridge
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -hex 32)}
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes: [uploads:/data]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
volumes:
  pgdata:
  uploads:
