<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · ClassBridge</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f8;color:#0f1f1d}
  main{max-width:28rem;padding:2rem;text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:1.4rem;margin:1rem 0 .5rem}
  p{color:#4b5b59;line-height:1.5}
  a{display:inline-block;margin-top:1rem;padding:.6rem 1rem;border-radius:.5rem;background:#0b7f75;color:#fff;text-decoration:none}
</style>

<main>
  <img src="/icons/icon-192.png" alt="">

  <p lang="fr" dir="ltr">Vous êtes hors ligne. Reconnectez-vous puis réessayez.</p>
  <p lang="ar" dir="rtl">أنت غير متصل. أعد الاتصال ثم حاول مرة أخرى.</p>
  <a href="/">Try again</a>
